<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<div class="app">
    <h2>📘 CTRACK</h2>

    <div class="card">
        <b>Saldo Saat Ini:</b> Rp {{ d.saldo }}<br>
        <b>Status:</b> {{ status }}
    </div>

    <div class="card">
        <form method="POST" action="/transaksi">
            <select name="jenis">
                <option value="masuk">Pemasukan</option>
                <option value="keluar">Pengeluaran</option>
            </select>
            <input type="number" name="jumlah" placeholder="Jumlah uang" required>
            <input name="catatan" placeholder="Catatan transaksi" required>
            <button>Simpan</button>
        </form>
    </div>

    <div class="card">
        <b>Riwayat Transaksi:</b><br><br>
        {% for r in d.riwayat %}
            {{ r.tanggal }} - {{ r.keterangan }} - Rp {{ r.jumlah }} ({{ r.catatan }})<br>
        {% endfor %}
    </div>

    <a href="/logout">Logout</a>
</div>
